# Grafana da máquina local. Só leitura e sem login: os painéis vêm do provisionamento (arquivos neste
# repositório), ninguém os edita pela tela, e não existe senha de administrador para vazar.
# A página de operação do front (/operacao) embute os painéis em iframe.
[server]
http_addr = 127.0.0.1
http_port = 3000

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = true
org_role = Viewer

[security]
allow_embedding = true
disable_initial_admin_creation = true

[users]
allow_sign_up = false
default_theme = light

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

# Os caminhos (dados, provisionamento, painel inicial) vêm do subir-observabilidade.ps1, por variável
# de ambiente: dependem de onde o repositório está.
