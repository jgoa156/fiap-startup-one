# Postgres local para desenvolvimento e testes. Mesma versão maior do RDS previsto.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: certamis
      POSTGRES_PASSWORD: certamis
      POSTGRES_DB: certamis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certamis"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
